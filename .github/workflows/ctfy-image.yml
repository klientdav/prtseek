name: CTFY agent image

# Builds and pushes the CTFY-0001 agent image. The platform pulls the image by
# digest, so the tag is only a label; what runs is what this workflow built.
#
# Required repository secret: CTFY_REGISTRY_TOKEN  — a CTFY API token
#   (Settings → API 令牌, prefix pf_). It is used as the registry password; the
#   username is ignored by the platform's registry (any value works).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. v1)
        required: true
        default: v1
      repository_prefix:
        description: Registry namespace (from the eval wizard)
        required: true
        default: registry.ctfy.io/00000000-0000-0000-0000-000000000000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the CTFY registry
        uses: docker/login-action@v3
        with:
          registry: registry.ctfy.io
          username: ctfy
          password: ${{ secrets.CTFY_REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ctfy
          push: true
          tags: ${{ inputs.repository_prefix }}/prtseek-ctfy:${{ inputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
