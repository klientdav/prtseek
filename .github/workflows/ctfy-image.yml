name: CTFY agent image

# Builds and pushes the CTFY-0001 agent image. The platform pulls the image by
# digest, so the tag is only a label; what runs is what this workflow built.
#
# Required repository secret: CTFY_REGISTRY_TOKEN
#   A CTFY API token (Settings → API 令牌, prefix pf_).
#
# That pf_ token is NOT a registry password: the registry only accepts a
# short-lived scope token minted from it (GET /api/v1/registry/token). This
# workflow trades it for one before logging in — passing the pf_ token to
# `docker login` directly fails with insufficient_scope at push time, after the
# image has already been built.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. v1)
        required: true
        default: v1
      repository_prefix:
        description: Registry namespace (from the eval wizard)
        required: true
        default: registry.ctfy.io/00000000-0000-0000-0000-000000000000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Trade the API token for a registry scope token
        id: registry
        env:
          CTFY_REGISTRY_TOKEN: ${{ secrets.CTFY_REGISTRY_TOKEN }}
          PREFIX: ${{ inputs.repository_prefix }}
        run: |
          set -euo pipefail
          if [ -z "${CTFY_REGISTRY_TOKEN}" ]; then
            echo "::error::secret CTFY_REGISTRY_TOKEN is empty — add a pf_ API token (Settings → API 令牌)."
            exit 1
          fi
          NAMESPACE="${PREFIX#registry.ctfy.io/}"
          REPO="${NAMESPACE}/prtseek-ctfy"
          # The token server authenticates the pf_ token as BASIC auth (any
          # username, the token as password) — docker's own flow. Sending it as
          # a Bearer header mints a token whose "access" list is empty, which
          # then fails every push with insufficient_scope.
          TOKEN=$(curl -fsS -u "ctfy:${CTFY_REGISTRY_TOKEN}" \
            "https://registry.ctfy.io/api/v1/registry/token?service=registry.ctfy.io&scope=repository:${REPO}:push,pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          if [ -z "${TOKEN}" ]; then
            echo "::error::the platform returned no registry token"
            exit 1
          fi
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          access = json.loads(base64.urlsafe_b64decode(payload)).get("access") or []
          if not access or "push" not in access[0].get("actions", []):
              sys.exit("::error::the minted token grants no push access: %r" % (access,))
          PY
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Log in to the CTFY registry
        env:
          CTFY_SCOPE_TOKEN: ${{ steps.registry.outputs.token }}
        run: |
          set -euo pipefail
          # Pass the token on stdin, not as a CLI argument: a masked value can
          # be mangled by the runner's secret redaction when echoed, and a
          # token in argv ends up in the process table.
          printf '%s' "${CTFY_SCOPE_TOKEN}" | docker login registry.ctfy.io -u ctfy --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ctfy
          push: true
          tags: ${{ inputs.repository_prefix }}/prtseek-ctfy:${{ inputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
